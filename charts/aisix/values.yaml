global:
  # -- Image pull secrets applied to every pod created by this chart
  imagePullSecrets: []

# -- Number of gateway replicas. Ignored once `autoscaling.enabled` or
# `keda.enabled` is true — the autoscaler owns the replica count from then on
# and the Deployment omits `spec.replicas` so `helm upgrade` cannot reset it.
replicaCount: 2

# -- Override the chart name used in resource names
nameOverride: ""
# -- Override the fully qualified resource name prefix
fullnameOverride: ""

image:
  # -- Gateway image repository
  repository: docker.io/api7/aisix
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image tag. Empty resolves to the chart `appVersion`
  tag: ""

## The gateway runs as an AISIX Cloud data plane: it authenticates to the
## control plane's data-plane manager with the mTLS bundle issued from
## **Data planes** in the console, then reads its configuration from the
## control plane. Everything in this section comes from that view.
##
## Set `controlPlane.enabled: false` to run the open-source gateway instead,
## with no control plane at all: resources come from a `resources.yaml` file
## supplied under `standalone` below, and nothing in this section is read.
controlPlane:
  # -- Read configuration from an AISIX control plane. Set to false to run
  # standalone, from the `resources.yaml` file configured under `standalone`
  enabled: true
  # -- Data-plane manager mTLS endpoint the gateway connects out to, e.g.
  # `https://dpm.example.com:7944`. Required.
  baseURL: ""
  # -- Control-plane etcd endpoint as bare `host:port`. Leave empty unless the
  # control plane publishes an etcd endpoint distinct from `baseURL`
  etcdEndpoint: ""
  # -- Heartbeat interval in seconds. The control plane marks a gateway
  # connected on its first heartbeat. Clamped to [5, 300] by the gateway
  heartbeatIntervalSeconds: 15
  certificate:
    # -- Read the bundle from an existing Secret instead of the PEM values
    # below. Recommended: it keeps the private key out of your values file
    existingSecret: ""
    # -- Secret key holding the client certificate PEM
    certKey: "cert.pem"
    # -- Secret key holding the private key PEM
    keyKey: "key.pem"
    # -- Secret key holding the CA bundle PEM
    caKey: "ca.pem"
    # -- Client certificate PEM. Used only when `existingSecret` is empty
    cert: ""
    # -- Private key PEM. Used only when `existingSecret` is empty
    key: ""
    # -- CA bundle PEM. Used only when `existingSecret` is empty
    ca: ""

## Standalone (open-source) mode, read only when `controlPlane.enabled` is
## false. Every resource — provider keys, models, caller API keys, guardrails,
## MCP servers, rate-limit policies — comes from one `resources.yaml`, supplied
## through exactly one of the three keys below. The chart renders a startup
## config pointing the gateway at it and mounts it read-only.
##
## The gateway re-reads the file on SIGHUP only, and the chart does not send
## one. A change to `standalone.resources` rolls the pods on `helm upgrade`
## (the pod template carries a checksum of the rendered content), so it takes
## effect on its own. An out-of-band edit to `standalone.existingSecret` or
## `standalone.existingConfigMap` does not — run
## `kubectl rollout restart deploy/<release>-aisix` after it.
standalone:
  # -- Inline `resources.yaml` content, as a map. Rendered into a
  # chart-managed Secret, because provider keys are credentials. Values may
  # reference environment variables as `${VAR}` — supply them through
  # `extraEnvVars` — so the credential itself need not live in this file
  resources: {}
  # -- Read `resources.yaml` from an existing Secret instead, under key
  # `resources.yaml`. Recommended when the file carries literal credentials
  existingSecret: ""
  # -- Read `resources.yaml` from an existing ConfigMap instead, under key
  # `resources.yaml`. Use only when every credential in it is a `${VAR}`
  # reference resolved from `extraEnvVars`
  existingConfigMap: ""

containerPorts:
  # -- Port the proxy listener binds inside the container. Nothing binds it
  # when `listeners` is set — that list then carries every proxy port, and the
  # gateway keeps requiring this address only to ignore it. The image carries
  # the `CAP_NET_BIND_SERVICE` file capability, so a privileged port works
  # without running as root — see `securityContext` below
  proxy: 3000
  # -- Port the Prometheus metrics listener binds inside the container
  metrics: 9090
  # -- Port the Admin API listener binds inside the container. Bound only when
  # `admin.enabled` is true
  admin: 3001

## Several proxy listeners at once — for example HTTPS and plain HTTP side by
## side, each on its own port. Empty (the default) keeps the single plain-HTTP
## listener described by `containerPorts.proxy` and `service.port`.
##
## A non-empty list is the complete set of proxy listeners and replaces that
## single one: nothing binds `containerPorts.proxy` any more, `service.port`
## and `service.nodePort` are not read, the one proxy Service publishes a port
## per entry, and the probes target the first entry. Every listener serves the
## same routes, including `/livez` and `/readyz`; TLS is per listener.
##
## Needs a gateway image that supports `proxy.listeners`. TLS material is read
## from a `kubernetes.io/tls` Secret you supply (keys `tls.crt` / `tls.key`),
## mounted read-only at `/etc/aisix/tls/<name>`.
# -- Proxy listeners, one entry per port. Empty keeps the single plain-HTTP
# listener described by `containerPorts.proxy` and `service.port` — see
# "Serve HTTPS and plain HTTP together" above
listeners: []
# listeners:
#   - name: https                 # port name, shared by the container port and the Service port
#     containerPort: 3443
#     servicePort: 443
#     nodePort: 0                 # optional; only for non-ClusterIP Service types
#     tls:
#       secretName: aisix-proxy-tls   # kubernetes.io/tls Secret (keys tls.crt / tls.key), e.g. issued by cert-manager
#   - name: http
#     containerPort: 3000
#     servicePort: 80

service:
  # -- Proxy Service type
  type: ClusterIP
  # -- Proxy Service port. Unused when `listeners` is set — each entry there
  # carries its own `servicePort`
  port: 80
  # -- Proxy Service nodePort, when `service.type` is NodePort or
  # LoadBalancer. Unused when `listeners` is set — each entry there carries its
  # own `nodePort`
  nodePort: ""
  # -- Extra annotations for the proxy Service, e.g. cloud load-balancer settings
  annotations: {}
  # -- `externalTrafficPolicy` for the proxy Service. `Local` preserves the
  # client source IP on NodePort / LoadBalancer types
  externalTrafficPolicy: ""

metrics:
  # -- Publish the gateway's Prometheus metrics on a separate ClusterIP
  # Service, so scraping never rides the (possibly public) proxy Service
  enabled: true
  service:
    # -- Metrics Service port
    port: 9090
    # -- Extra annotations for the metrics Service
    annotations: {}
  serviceMonitor:
    # -- Create a Prometheus Operator ServiceMonitor for the metrics Service
    enabled: false
    # -- Namespace to create the ServiceMonitor in. Empty uses the release namespace
    namespace: ""
    # -- Scrape interval
    interval: 30s
    # -- Scrape timeout. Empty leaves the Prometheus default
    scrapeTimeout: ""
    # -- Extra labels, e.g. the `release` label your Prometheus selects on
    labels: {}
    # -- Scrape-time relabeling rules
    relabelings: []
    # -- Metric relabeling rules
    metricRelabelings: []

## The gateway's Admin API, standalone mode only (a gateway connected to a
## control plane never binds it). Against the resources file it is read-only:
## `/admin/v1/*` lists and gets what the gateway loaded — resources, model
## status — and needs one of the admin keys (`Authorization: Bearer <key>` or
## `x-api-key: <key>`). The same listener serves the Playground
## (`POST /playground/chat/completions`, authenticated with a caller API key
## like the proxy). It is published on its own ClusterIP Service,
## `<fullname>-admin`, never on the proxy Service.
admin:
  # -- Bind the Admin API on `containerPorts.admin` and create the admin
  # Service. Requires `controlPlane.enabled=false` and admin keys from `keys`
  # or `existingSecret`
  enabled: false
  # -- Admin keys, rendered into a chart-managed Secret and passed to the
  # gateway from it. A key cannot contain a comma
  keys: []
  # -- Read the admin keys from an existing Secret instead, so they stay out of
  # your values file. The value is one key, or several separated by commas
  existingSecret: ""
  # -- Secret key holding the admin keys
  existingSecretKey: "admin-keys"
  service:
    # -- Admin Service port
    port: 3001
    # -- Extra annotations for the admin Service
    annotations: {}

## Rate-limit counters are per-replica by default, so N replicas enforce N×
## every configured limit. Point the gateway at a shared Redis before running
## more than one replica — including any replica an autoscaler adds.
rateLimit:
  # -- Rate-limit counter backend: `memory` (per-replica) or `redis` (shared)
  backend: memory
  redis:
    # -- Redis connection URL, e.g. `redis://redis.default.svc:6379`. Required
    # when `rateLimit.backend` is redis and `existingSecret` is empty
    url: ""
    # -- Read the connection URL from an existing Secret instead, so a URL
    # carrying a password stays out of your values file
    existingSecret: ""
    # -- Secret key holding the connection URL
    existingSecretKey: "redis-url"

## Gateway startup configuration, rendered into the config file the gateway
## boots from (a ConfigMap mounted read-only, the same in both modes). It
## mirrors that file one-to-one — the section and key names are the gateway's
## own, as in its `config.example.yaml` — and every key is listed with the
## gateway's own default, so an untouched block renders the configuration the
## gateway would use anyway. A `null` key is left out of the file, which means
## "the gateway's default".
##
## A few keys are set by the chart from its own values and must not be written
## here — the render fails naming the value to use instead: the proxy and
## metrics addresses (`containerPorts`), `proxy.listeners` / `proxy.tls`
## (`listeners`), `ratelimit.backend` and `ratelimit.redis.url` (`rateLimit`),
## the control-plane connection under `managed` (`controlPlane`),
## `resources_file` (`standalone`), and `admin` (`admin` and `containerPorts.admin`).
## Keys that hold a credential are never written to the ConfigMap either: set
## them through `configSecrets` below.
##
## A change here rolls the pods on `helm upgrade`.
config:
  # -- Deployment-wide AWS Bedrock endpoint override for bedrock guardrails,
  # e.g. a LocalStack URL. Null uses the AWS SDK default
  bedrock_endpoint_url: null
  proxy:
    # -- Request-body size cap in bytes. 0 means no cap
    request_body_limit_bytes: 0
    real_ip:
      # -- CIDRs (or bare IPs) of proxies trusted to set the client-IP header
      trusted_proxies: []
      # -- Walk the header right to left past every trusted proxy
      recursive: false
      # -- Header carrying the client IP
      header: x-forwarded-for
    request_id:
      # -- Headers a caller may supply its own request id in. Add
      # `x-request-id` only when no proxy in front stamps it
      accept_headers:
        - x-aisix-request-id
    # -- (bool) Thread-per-core serving topology. Null uses the gateway default (on
    # for Linux)
    thread_per_core: null
    # -- (int) Worker count. Null uses the gateway default
    workers: null
    # -- Entry-level URL rewrite rules, first match wins, e.g.
    # `[{name: per-server-mcp, match: "^/mcp-servers/([^/]+)/mcp$", rewrite: "/mcp/$1"}]`
    url_rewrites: []
  observability:
    # -- Service name reported in telemetry
    service_name: aisix
    # -- Log level: trace, debug, info, warn or error
    log_level: info
    # -- Write an access-log line per request
    access_log: true
    metrics:
      # -- Complete optional label list per metric, e.g.
      # `{aisix_request_ttft_seconds: [model, provider]}`. Omitted metrics keep
      # their default labels
      labels: {}
      # -- User-Agent to `client_type` mapping rules, first match wins, e.g.
      # `[{pattern: "^py-billing-batcher/", client: billing-batcher}]`
      client_type_rules: []
      # -- Per-metric histogram bucket edges in seconds. Null keeps that
      # metric's default buckets
      buckets:
        request_ttft: null
        request_e2e_latency: null
        guardrail_latency: null
        a2a_ttfb: null
      prometheus:
        # -- Serve Prometheus metrics on the metrics listener
        # (`containerPorts.metrics`)
        enabled: true
        # -- Metrics path
        path: /metrics
    debug:
      # -- Serve the unauthenticated heap-profile endpoint
      # (`/debug/pprof/heap`)
      enabled: true
      # -- Diagnostics listener address. Loopback keeps it off the network
      addr: "127.0.0.1:9091"
    heap_profiling:
      auto_dump:
        # -- Write a heap profile as resident memory nears the memory limit
        enabled: true
        # -- Fractions of the memory limit that each trigger one profile
        thresholds:
          - 0.8
          - 0.9
        # -- Directory the profiles are written to
        dir: /var/lib/aisix/heap
        # -- Newest profiles kept
        keep: 5
  cache:
    # -- Legacy cache backend switch, `memory` or `redis`. `redis` requires
    # `cache.redis`. Which cache serves a request is chosen per cache policy
    backend: memory
    # -- (object) Shared Redis for the response cache, e.g. `{mode: single}`; the redis
    # cache is built only when this is set. Keys: `mode` (single, cluster,
    # sentinel), `nodes`, `sentinels`, `master_name`, `database`, `tls`,
    # `timeout_secs`. `url`, `username` and `password` go through
    # `configSecrets`
    redis: null
  ratelimit:
    # -- Seconds a concurrency-limit slot is held at most
    concurrency_ttl_secs: 300
    # -- (object) Extra settings for the shared rate-limit Redis selected by
    # `rateLimit.backend: redis`, e.g. `{timeout_secs: 2}` or
    # `{mode: cluster, nodes: [...]}`. Same keys as `cache.redis`; the URL
    # comes from `rateLimit.redis`, `username` and `password` go through
    # `configSecrets`
    redis: null
  upstream:
    # -- Request timeout for calls to LLM providers, in milliseconds
    timeout_ms: 6000000
    # -- Streaming idle timeout in milliseconds. 0 means none
    stream_timeout_ms: 0
    # -- Connect timeout in milliseconds
    connect_timeout_ms: 5000
    # -- TCP keepalive idle time in seconds
    tcp_keepalive_secs: 60
    # -- TCP keepalive probe interval in seconds
    tcp_keepalive_interval_secs: 30
    # -- TCP keepalive probes before the connection is dropped
    tcp_keepalive_retries: 5
    # -- Seconds an idle pooled connection is kept. Lower it when a load
    # balancer or NAT between the gateway and the provider closes idle
    # connections sooner
    pool_idle_timeout_secs: 30
    # -- (int) Idle pooled connections kept per host. Null means unbounded
    pool_max_idle_per_host: null
    # -- Retry budget every dispatch starts from
    retries: 2
    tls:
      # -- Extra CA bundle, added to the platform trust store, for every
      # upstream TLS handshake. Mount the file through `extraVolumes`
      ca_file: null
      # -- Client certificate for mutual TLS to upstreams
      client_cert_file: null
      # -- Client key for mutual TLS to upstreams
      client_key_file: null
      # -- Verify upstream certificates. false accepts any certificate — test
      # use only
      verify: true
  downstream:
    # -- Seconds an idle client connection is held. 0 never closes it
    idle_timeout_secs: 0
    # -- Seconds between SSE keepalive comments on a stalled stream
    sse_keepalive_interval_secs: 15
  shutdown:
    # -- Seconds the gateway keeps accepting after SIGTERM while `/readyz`
    # reports 503. `terminationGracePeriodSeconds` must cover it
    min_drain_secs: 30
  ## Read in control-plane mode only.
  etcd:
    # -- Bound on one dial to the control plane's etcd, in milliseconds. 0
    # means unbounded
    dial_timeout_ms: 5000
    # -- (int) Bound on one etcd request, in milliseconds. Null means unbounded
    request_timeout_ms: null
  ## Read in control-plane mode only. The connection itself comes from
  ## `controlPlane`.
  managed:
    # -- Extra CA bundle trusted for the control-plane connection, when it
    # serves a private-CA certificate. Mount the file through `extraVolumes`
    cp_ca_cert_file: null
    # -- Directory the materialised mTLS bundle is written to
    mtls_dir: /var/lib/aisix/mtls
    # -- File the gateway id is persisted in
    dp_id_file: /var/lib/aisix/dp_id
    # -- Persist a configuration snapshot for recovery while etcd is
    # unreachable. The snapshot holds unencrypted credentials
    snapshot_cache_enabled: false
    # -- Snapshot location. Null uses `/var/lib/aisix/config_cache.json`
    snapshot_cache_path: null

# -- Configuration keys that hold a credential, each read from a Secret you
# supply and handed to the gateway as an environment variable (which
# overrides the config file), never written to the ConfigMap. Keyed by the
# configuration path: `cache.redis.url`, `cache.redis.username`,
# `cache.redis.password`, `ratelimit.redis.username` or
# `ratelimit.redis.password`. For example
# `{cache.redis.password: {secretName: redis-auth, key: password}}`
configSecrets: {}

## HorizontalPodAutoscaler. Scaling is safe by construction: a new replica is
## kept out of the Service until its readiness probe passes, which happens
## only after it has loaded its configuration from the control plane.
##
## Requires a metrics source for the chosen metrics (metrics-server for the
## CPU / memory targets below). Mutually exclusive with `keda.enabled`.
autoscaling:
  # -- Create a HorizontalPodAutoscaler for the gateway Deployment
  enabled: false
  # -- Lower replica bound
  minReplicas: 2
  # -- Upper replica bound
  maxReplicas: 10
  # -- Target average CPU utilization, in percent of the CPU request. Set to
  # null to drop the CPU metric
  targetCPUUtilizationPercentage: 70
  # -- Target average memory utilization, in percent of the memory request.
  # Null by default: gateway memory tracks in-flight streams more than load
  targetMemoryUtilizationPercentage: null
  # -- Extra `spec.metrics` entries appended verbatim — Pods / Object /
  # External metrics such as a Prometheus adapter series
  extraMetrics: []
  # -- `spec.behavior` for the HPA. Empty uses the Kubernetes defaults
  # (immediate scale-up, 5-minute scale-down stabilization). A gateway that
  # carries long streaming responses usually wants a gentler scale-down, e.g.
  # `scaleDown: {policies: [{type: Pods, value: 1, periodSeconds: 60}]}`
  behavior: {}

## KEDA ScaledObject, for scaling on request-driven signals rather than
## CPU / memory — e.g. a Prometheus query over the gateway's own
## `aisix_llm_requests_total`. Requires KEDA in the cluster.
## Mutually exclusive with `autoscaling.enabled`.
keda:
  # -- Create a KEDA ScaledObject for the gateway Deployment
  enabled: false
  # -- Lower replica bound
  minReplicas: 2
  # -- Upper replica bound
  maxReplicas: 10
  # -- How often KEDA evaluates the triggers, in seconds
  pollingInterval: 15
  # -- Seconds to wait after the last trigger fires before scaling down
  cooldownPeriod: 300
  # -- Restore the original replica count when the ScaledObject is deleted
  restoreToOriginalReplicaCount: false
  # -- Replica count to fall back to when a trigger source is unreachable,
  # e.g. `{failureThreshold: 3, replicas: 4}`
  fallback: {}
  # -- Extra annotations for the ScaledObject
  annotations: {}
  # -- KEDA triggers. Required when `keda.enabled` is true. For example:
  # `[{type: prometheus, metadata: {serverAddress: "http://prometheus:9090",
  # query: "sum(rate(aisix_llm_requests_total[2m]))", threshold: "100"}}]`
  triggers: []
  # -- `behavior` for the HPA KEDA creates. Empty uses the Kubernetes defaults
  behavior: {}

podDisruptionBudget:
  # -- Create a PodDisruptionBudget so voluntary disruptions (node drains,
  # cluster upgrades) cannot take the whole gateway down at once
  enabled: false
  # -- Minimum available pods. Takes precedence over `maxUnavailable`
  minAvailable: ""
  # -- Maximum unavailable pods
  maxUnavailable: 1

serviceAccount:
  # -- Create a ServiceAccount for the gateway
  create: true
  # -- ServiceAccount name. Defaults to the release fullname
  name: ""
  # -- ServiceAccount annotations
  annotations: {}

## No CPU limit by default: CFS throttling adds tail latency on a proxy and
## suppresses the very CPU signal the HorizontalPodAutoscaler scales on. The
## CPU *request* is mandatory for CPU-target autoscaling and is set below.
resources:
  requests:
    cpu: 500m
    memory: 256Mi
  limits:
    memory: 1Gi

## The image already runs as uid 10001 and declares it numerically, which is
## what `runAsNonRoot` needs to verify without the uid being repeated here.
## Add `runAsUser` and `fsGroup` back to pin a fixed uid/gid: nothing in the
## chart depends on the numbers, since the one writable path is an emptyDir.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

## NET_BIND_SERVICE is added back after dropping ALL because the gateway
## binary carries `cap_net_bind_service=+ep` as a file capability (so it can
## bind privileged ports without root). With that capability's effective bit
## set, exec fails outright if the capability is missing from the container's
## bounding set — dropping ALL without adding it back yields a pod that never
## starts.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE

## All three probes target the proxy listener: `/livez` and `/readyz` are
## served on it, so none of them gets an answer until it is bound. In etcd
## mode the gateway binds it only after its first configuration apply has
## succeeded, so a replica joins the Service only once it has a configuration
## to serve from.
startupProbe:
  # -- Gate liveness and readiness until the proxy listener is bound. In etcd
  # mode that happens only after the gateway's first configuration apply
  # succeeds, so the budget here (period x threshold) has to cover reaching
  # the configuration source and applying what it holds — not merely starting
  # the process. How long that apply takes scales with how much configuration
  # the environment holds, so the 300s default (2s x 150) is deliberately
  # generous headroom for a large one rather than a bound tuned to a measured
  # boot. The period stays short so an ordinary boot still passes within a
  # couple of seconds and rollouts are not slowed by the headroom; only the
  # pathological case waits.
  #
  # The budget is also wide enough to contain the gateway's own retry
  # schedule. It keeps retrying the configuration read on an exponential
  # backoff — capped at a minute between attempts — for as long as it is up,
  # and binds the moment one attempt succeeds. A configuration source that
  # comes back inside the budget is therefore retried while the budget still
  # has room, and the instance binds on its own, with no restart. A budget
  # much shorter than the backoff's cap truncates that schedule instead, and
  # kills the container in the gap before the retry that would have worked.
  #
  # Once the budget does expire the kubelet kills and restarts the container
  # — the Pod is not recreated — which remains the intended outcome for a
  # source that stays unreachable: an instance that has never applied a
  # configuration has nothing to serve, and the restarted container simply
  # resumes the same wait. Boots that bind immediately — file mode, and an
  # etcd-mode boot that restores a usable snapshot cache — are unaffected.
  enabled: true
  periodSeconds: 2
  failureThreshold: 150
readinessProbe:
  enabled: true
  periodSeconds: 3
  failureThreshold: 3
livenessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 3

# -- Seconds the whole termination sequence may take, from the pod being
# marked for deletion to SIGKILL. It covers the `preStop` sleep, the gateway's
# own drain window, and the in-flight drain that follows — the gateway drains
# without a deadline of its own, so this value is the real cap. The default is
# sized to protect request success rate across a rolling update, and the
# trade-off is that a rolling update can take longer: it budgets two chained
# requests at the ten-minute timeout mainstream agent clients default to, plus
# the `preStop` sleep. It is a budget, not a guarantee — a response still running
# when it expires is cut. See "Termination and draining" in the README.
terminationGracePeriodSeconds: 1230

# -- Seconds to sleep in a `preStop` hook before the gateway receives SIGTERM.
# Endpoint removal and SIGTERM are concurrent, so without this pause a
# terminating pod can still be handed new connections by a kube-proxy that has
# not caught up. Set to 0 to drop the hook.
#
# This covers balancers that learn about the pod from the Kubernetes API. One
# that polls a health check instead learns nothing here — the pod is still
# fully ready throughout the sleep — and is covered by the gateway's own drain
# window (`shutdown.min_drain_secs`, 30s by default), which starts at SIGTERM
# with `/readyz` already answering 503.
preStopSleepSeconds: 30

# -- Extra environment variables for the gateway container: system-level
# environment variables (such as `TZ`) and variables referenced by the
# resources file. Gateway settings belong in `config`. Overriding a variable
# the chart sets itself is only a compatibility path for existing deployments:
# for a name chart 1.5.0 set, the rendered container then lists it twice, which
# Helm 4 server-side apply rejects. New installs set the value in its own key
# or under `config`
extraEnvVars: []

# -- Extra volumes for the gateway pod
extraVolumes: []
# -- Extra volume mounts for the gateway container
extraVolumeMounts: []

# -- Annotations for the gateway pods
podAnnotations: {}
# -- Labels for the gateway pods
podLabels: {}
# -- Node selector for the gateway pods
nodeSelector: {}
# -- Tolerations for the gateway pods
tolerations: []
# -- Affinity rules for the gateway pods
affinity: {}
# -- Topology spread constraints, e.g. to spread replicas across zones
topologySpreadConstraints: []
# -- Deployment update strategy
updateStrategy: {}
# -- Pod priority class
priorityClassName: ""
