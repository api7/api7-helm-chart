apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aisix.fullname" . }}-config
  labels:
    {{- include "aisix.labels" . | nindent 4 }}
    {{- include "aisix.selectorLabels" . | nindent 4 }}
data:
  # The gateway's startup configuration: `config` from values.yaml, with the
  # keys the chart owns filled in for this mode. Credentials are never here —
  # they reach the gateway from Secrets, as mounted files or as environment
  # variables, which override this file.
  config.yaml: |
    {{- include "aisix.configFile" . | trim | nindent 4 }}
