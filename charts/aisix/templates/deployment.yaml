apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aisix.fullname" . }}
  labels:
    {{- include "aisix.labels" . | nindent 4 }}
    {{- include "aisix.selectorLabels" . | nindent 4 }}
spec:
  {{- if not (or .Values.autoscaling.enabled .Values.keda.enabled) }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "aisix.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or (not .Values.controlPlane.enabled) (not .Values.controlPlane.certificate.existingSecret) .Values.podAnnotations }}
      annotations:
        {{- if .Values.controlPlane.enabled }}
        {{- if not .Values.controlPlane.certificate.existingSecret }}
        # Roll the pods when the chart-managed bundle changes, so a rotated
        # certificate takes effect without a manual restart. An existingSecret
        # has its own lifecycle — restart the Deployment after rotating it.
        checksum/mtls: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- else }}
        # Roll the pods when the rendered startup config or the chart-managed
        # resources file changes. The gateway re-reads the resources file on
        # SIGHUP only and the chart never sends one, so the rollout is what
        # applies the change. An existingSecret / existingConfigMap has its own
        # lifecycle — restart the Deployment after editing it.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.standalone.resources }}
        checksum/resources: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "aisix.labels" . | nindent 8 }}
        {{- include "aisix.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # The gateway reads every AISIX_-prefixed environment variable as a
      # configuration override and rejects unknown keys. Service links inject
      # one variable per Service in the namespace, so any Service whose name
      # starts with "aisix" — this chart's own, or a control plane installed
      # alongside it — stops the gateway from booting ("unknown field
      # `cp_ui_service_port_http`"). Not a value: there is no working setting
      # other than false.
      enableServiceLinks: false
      {{- include "aisix.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "aisix.serviceAccountName" . }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: aisix
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            {{- if .Values.listeners }}
            {{- range .Values.listeners }}
            - name: {{ .name }}
              containerPort: {{ .containerPort }}
              protocol: TCP
            {{- end }}
            {{- else }}
            - name: proxy
              containerPort: {{ .Values.containerPorts.proxy }}
              protocol: TCP
            {{- end }}
            - name: metrics
              containerPort: {{ .Values.containerPorts.metrics }}
              protocol: TCP
          env:
            - name: AISIX_CONFIG_PATH
              {{- if .Values.controlPlane.enabled }}
              value: /etc/aisix/config.managed.yaml
              {{- else }}
              value: {{ include "aisix.standaloneConfigPath" . }}
              {{- end }}
            - name: AISIX_PROXY__ADDR
              value: "0.0.0.0:{{ .Values.containerPorts.proxy }}"
            {{- if .Values.listeners }}
            # The complete set of proxy listeners, as one JSON document: the
            # gateway takes no indexed environment variables. It replaces the
            # single listener AISIX_PROXY__ADDR describes — that address is
            # then required but ignored, and nothing binds it.
            - name: AISIX_PROXY__LISTENERS
              value: {{ include "aisix.proxyListenersJson" . | quote }}
            {{- end }}
            - name: AISIX_OBSERVABILITY__METRICS__PROMETHEUS__ADDR
              value: "0.0.0.0:{{ .Values.containerPorts.metrics }}"
            {{- if .Values.controlPlane.enabled }}
            - name: AISIX_MANAGED__CP_BASE_URL
              value: {{ .Values.controlPlane.baseURL | quote }}
            {{- with .Values.controlPlane.etcdEndpoint }}
            - name: AISIX_MANAGED__CP_ETCD_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            - name: AISIX_MANAGED__HEARTBEAT_INTERVAL_SECS
              value: {{ .Values.controlPlane.heartbeatIntervalSeconds | quote }}
            - name: AISIX_MANAGED__CP_CERT_PEM
              valueFrom:
                secretKeyRef:
                  name: {{ include "aisix.certSecretName" . }}
                  key: {{ .Values.controlPlane.certificate.certKey }}
            - name: AISIX_MANAGED__CP_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: {{ include "aisix.certSecretName" . }}
                  key: {{ .Values.controlPlane.certificate.keyKey }}
            - name: AISIX_MANAGED__CP_CA_PEM
              valueFrom:
                secretKeyRef:
                  name: {{ include "aisix.certSecretName" . }}
                  key: {{ .Values.controlPlane.certificate.caKey }}
            {{- end }}
            {{- if eq .Values.rateLimit.backend "redis" }}
            - name: AISIX_RATELIMIT__BACKEND
              value: "redis"
            - name: AISIX_RATELIMIT__REDIS__URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "aisix.redisSecretName" . }}
                  key: {{ include "aisix.redisSecretKey" . }}
            {{- end }}
            {{- with .Values.extraEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.startupProbe.enabled }}
          # /livez answers as soon as the proxy listener is bound, which in
          # etcd mode is once the first configuration apply has succeeded.
          # Gating on it keeps liveness and readiness quiet for the whole of
          # boot, that wait included; `startupProbe` in values.yaml explains
          # the budget it needs.
          startupProbe:
            httpGet:
              path: /livez
              port: {{ include "aisix.proxyPortName" . }}
              {{- if include "aisix.proxyListenerTLS" . }}
              scheme: HTTPS
              {{- end }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          # /readyz answers 503 while the instance is draining and 200 once it
          # can serve. In etcd mode this port answers nothing at all before
          # the gateway's first configuration apply: the proxy listener the
          # probe targets is not bound until then, so the probe sees a refused
          # connection rather than a 503. Either way a replica the autoscaler
          # adds joins the Service only once it has a configuration to serve
          # from, and leaves it as soon as it starts draining — both measured
          # on the listener that carries the traffic.
          #
          # It no longer withdraws an instance whose configuration watch has
          # merely gone quiet, which an idle environment does routinely and
          # which used to empty the Service of every healthy replica at once
          # (api7/aisix#841, shipped in appVersion 0.7.0). Configuration
          # freshness stays visible on /status/config and aisix_config_*.
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ include "aisix.proxyPortName" . }}
              {{- if include "aisix.proxyListenerTLS" . }}
              scheme: HTTPS
              {{- end }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /livez
              port: {{ include "aisix.proxyPortName" . }}
              {{- if include "aisix.proxyListenerTLS" . }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if gt (int .Values.preStopSleepSeconds) 0 }}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "{{ .Values.preStopSleepSeconds }}"]
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            # The gateway writes its mTLS material, gateway id, and
            # configuration snapshot here. Per-pod and ephemeral by design:
            # replicas share one certificate but register as separate
            # instances, and a restarted pod re-registers.
            - name: state
              mountPath: /var/lib/aisix
            {{- if not .Values.controlPlane.enabled }}
            # Each in its own directory, so neither mount shadows the
            # /etc/aisix/config.managed.yaml the image ships.
            - name: config
              mountPath: {{ include "aisix.standaloneConfigDir" . }}
              readOnly: true
            - name: resources
              mountPath: {{ include "aisix.standaloneResourcesDir" . }}
              readOnly: true
            {{- end }}
            {{- range .Values.listeners }}
            {{- if .tls }}
            {{- if .tls.secretName }}
            - name: tls-{{ .name }}
              mountPath: {{ include "aisix.proxyListenerTLSDir" . }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: state
          emptyDir: {}
        {{- if not .Values.controlPlane.enabled }}
        - name: config
          configMap:
            name: {{ include "aisix.fullname" . }}-config
        - name: resources
          {{- if .Values.standalone.existingConfigMap }}
          configMap:
            name: {{ include "aisix.resourcesObjectName" . }}
          {{- else }}
          secret:
            secretName: {{ include "aisix.resourcesObjectName" . }}
          {{- end }}
        {{- end }}
        {{- range .Values.listeners }}
        {{- if .tls }}
        {{- if .tls.secretName }}
        - name: tls-{{ .name }}
          secret:
            secretName: {{ .tls.secretName }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
