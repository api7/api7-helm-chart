{{- if .Values.keda.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "aisix.fullname" . }}
  labels:
    {{- include "aisix.labels" . | nindent 4 }}
    {{- include "aisix.selectorLabels" . | nindent 4 }}
  {{- with .Values.keda.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  scaleTargetRef:
    name: {{ include "aisix.fullname" . }}
  pollingInterval: {{ .Values.keda.pollingInterval }}
  cooldownPeriod: {{ .Values.keda.cooldownPeriod }}
  minReplicaCount: {{ .Values.keda.minReplicas }}
  maxReplicaCount: {{ .Values.keda.maxReplicas }}
  {{- with .Values.keda.fallback }}
  fallback:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  triggers:
    {{- $triggers := list }}
    {{- range .Values.keda.triggers }}
    {{- $trigger := deepCopy . }}
    {{- /* KEDA has no default metricType for a resource trigger and refuses one without it */}}
    {{- if and (has (toString .type) (list "cpu" "memory")) (not .metricType) }}
    {{- $_ := set $trigger "metricType" (dig "type" "" (.metadata | default dict) | default "Utilization") }}
    {{- end }}
    {{- $triggers = append $triggers $trigger }}
    {{- end }}
    {{- toYaml $triggers | nindent 4 }}
  advanced:
    restoreToOriginalReplicaCount: {{ .Values.keda.restoreToOriginalReplicaCount }}
    {{- with .Values.keda.behavior }}
    horizontalPodAutoscalerConfig:
      behavior:
        {{- toYaml . | nindent 8 }}
    {{- end }}
{{- end }}
