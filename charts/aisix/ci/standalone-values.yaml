# Values used by chart-testing for the standalone (no control plane) mode.
# Unlike ci/default-values.yaml this file drives `ct install` as well as
# `ct lint`, so everything it references has to exist in the cluster.

controlPlane:
  enabled: false

replicaCount: 1

standalone:
  resources:
    _format_version: "2"
    provider_keys:
      - id: 0b6f3c1e-2f0a-4c5e-9d55-7d1a8b0c2e11
        display_name: openai-main
        provider: openai
        adapter: openai
        api_key: ${OPENAI_API_KEY}
        api_base: https://api.openai.com/v1
    models:
      - id: 6efd592d-a73b-573d-8e2c-e9e103692f92
        display_name: gpt-4o-mini
        provider: openai
        model_name: gpt-4o-mini
        provider_key_id: 0b6f3c1e-2f0a-4c5e-9d55-7d1a8b0c2e11
    api_keys:
      # sha256 of `ci-caller-placeholder`; a hash is not a credential.
      - id: 4a1c9e2b-7d3f-4b6a-8c5e-1f2a3b4c5d6e
        display_name: ci-caller
        key_hash: 4adaf08efa9183c9371238ebd87b767857dd7cbfb5d6b80e718fad5b5f666bba
        allowed_model_ids:
          - 6efd592d-a73b-573d-8e2c-e9e103692f92

# Referenced by the resources file above, which fails to load if it is unset.
# No request is sent upstream during the install test, so the value only has
# to be non-empty.
extraEnvVars:
  - name: OPENAI_API_KEY
    value: sk-ci-placeholder-not-a-real-key
