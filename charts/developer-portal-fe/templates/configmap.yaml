apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "developer-portal-fe.fullname" . }}-config
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "developer-portal-fe.labels" . | nindent 4 }}
data:
  {{- /*
    developerPortal.config passes the whole application config schema through.
    The connection settings the chart owns are merged last so they win over
    anything set there — in particular the ${...} placeholders that keep the
    portal token, database URL and auth secret in a Secret instead of here.
    deepCopy is required: mergeOverwrite mutates its first argument in place.
  */}}
  {{- $owned := dict
        "portal" (dict "url" .Values.portal.url "token" "${PORTAL_TOKEN}")
        "db"     (dict "url" "${DB_URL}")
        "auth"   (dict "secret" "${AUTH_SECRET}")
        "app"    (dict "baseURL" .Values.app.baseURL
                       "trustedOrigins" .Values.app.trustedOrigins) }}
  config.yaml: |
    {{- toYaml (mergeOverwrite (deepCopy (.Values.developerPortal.config | default dict)) $owned) | nindent 4 }}
