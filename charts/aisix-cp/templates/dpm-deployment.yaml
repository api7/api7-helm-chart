apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aisix-cp.fullname" . }}-dpm
  labels:
    {{- include "aisix-cp.labels" . | nindent 4 }}
    {{- include "aisix-cp.selectorLabels" (dict "root" . "component" "dpm") | nindent 4 }}
spec:
  replicas: {{ .Values.dpm.replicaCount }}
  selector:
    matchLabels:
      {{- include "aisix-cp.selectorLabels" (dict "root" . "component" "dpm") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aisix-cp.labels" . | nindent 8 }}
        {{- include "aisix-cp.selectorLabels" (dict "root" . "component" "dpm") | nindent 8 }}
      annotations:
        # Roll the pods when the rendered config file or a value in a Secret
        # this chart renders changes: both are read at boot only. A Secret
        # supplied by name (existingSecret) or rendered by the PostgreSQL
        # subchart is not hashed — restart the Deployment after editing it.
        checksum/config: {{ include (print $.Template.BasePath "/dpm-configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include "aisix-cp.secretChecksum" . }}
    spec:
      {{- include "aisix-cp.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "aisix-cp.serviceAccountName" . }}
      {{- with .Values.dpm.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.postgresql.builtin }}
      initContainers:
        {{- include "aisix-cp.pgWaitInitContainer" . | nindent 8 }}
      {{- end }}
      containers:
        - name: dpm
          image: "{{ .Values.dpm.image.repository }}:{{ .Values.dpm.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.dpm.image.pullPolicy }}
          {{- with .Values.dpm.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: tls
              containerPort: 7944
              protocol: TCP
            {{- if .Values.dpm.service.healthListen }}
            - name: health
              containerPort: {{ trimPrefix ":" .Values.dpm.service.healthListen | int }}
              protocol: TCP
            {{- end }}
          env:
            {{- include "aisix-cp.env" (dict "chart" (include "aisix-cp.dpmEnv" .) "legacy" (include "aisix-cp.legacyEnv.dpm" .) "extra" .Values.dpm.extraEnvVars) | nindent 12 }}
          # Probe the plain-HTTP /healthz (poller liveness), not the
          # mTLS port: a kubelet cannot present a client cert, and a
          # TCP check on 7944 stays green even if the outbox poller is
          # dead/wedged. A stale poller fails readiness (removed from the
          # Service) and liveness (pod restarted). When the health
          # listener is disabled (healthListen=""), the dp-manager serves
          # no /healthz, so fall back to a TCP check on the mTLS port.
          #
          # On a cold start the dp-manager binds NEITHER port until
          # bootstrapCertManagerWithRetry succeeds: cp-api owns the
          # schema migration, so on a first boot dp-manager sits in an
          # in-process retry loop (~2 min budget) waiting for the shared
          # tables to appear. The liveness settings below would kill it
          # ~30s in — well inside its own retry window — turning a
          # benign, self-healing boot race into a crash loop. The
          # startupProbe suspends liveness and readiness until the first
          # success, with a budget that must stay LONGER than that
          # in-process retry window (see ci-helm.yml, which asserts it).
          {{- if .Values.dpm.service.healthListen }}
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          {{- else }}
          startupProbe:
            tcpSocket:
              port: tls
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
              port: tls
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: tls
            initialDelaySeconds: 10
            periodSeconds: 10
          {{- end }}
          {{- with .Values.dpm.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: {{ include "aisix-cp.configDir" . }}
              readOnly: true
            {{- with include "aisix-cp.databaseCAVolumeMount" . | trim }}
            {{- . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "aisix-cp.fullname" . }}-dpm-config
        {{- with include "aisix-cp.databaseCAVolume" . | trim }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- with .Values.dpm.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dpm.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dpm.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- define "aisix-cp.dpmEnv" -}}
- name: AISIX_DPMGR_CONFIG_FILE
  value: {{ include "aisix-cp.configDir" . }}/config.yaml
{{- /* Secrets: never in the ConfigMap. */}}
- name: AISIX_DPMGR_DATABASE_PASSWORD
  valueFrom:
    secretKeyRef:
      name: {{ include "aisix-cp.pgSecretName" . }}
      key: {{ include "aisix-cp.pgPasswordSecretKey" . }}
- name: AISIX_DPMGR_MASTER_KEY
  valueFrom:
    secretKeyRef:
      name: {{ include "aisix-cp.secretName" . }}
      key: master-key
{{- range (include "aisix-cp.retiredMasterKeys" . | fromJsonArray) }}
- name: AISIX_DPMGR_MASTER_KEY_RETIRED_{{ .envSuffix }}
  valueFrom:
    secretKeyRef:
      name: {{ include "aisix-cp.secretName" $ }}
      key: {{ .secretKey }}
{{- end }}
{{- /* Kept for extraEnvVars that reference $(PGPASSWORD). */}}
- name: PGPASSWORD
  valueFrom:
    secretKeyRef:
      name: {{ include "aisix-cp.pgSecretName" . }}
      key: {{ include "aisix-cp.pgPasswordSecretKey" . }}
{{- end }}
