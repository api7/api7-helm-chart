{{- /*
COMPAT-SINCE: 1.5.0 #1758 — chart 1.5.0 ran the dashboard behind this Service, and offered it as a NodePort for a same-origin proxy that sends pages here and /api/* to cp-api. cp-api serves the dashboard itself now, so the Service keeps its name, type, port and nodePort but selects the api pods; such a proxy keeps working unchanged. Remove once no supported install can still carry 1.5.0 values.
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aisix-cp.fullname" . }}-ui
  labels:
    {{- include "aisix-cp.labels" . | nindent 4 }}
    {{- include "aisix-cp.selectorLabels" (dict "root" . "component" "ui") | nindent 4 }}
spec:
  type: {{ .Values.ui.service.type }}
  ports:
    - port: {{ .Values.ui.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq .Values.ui.service.type "NodePort") .Values.ui.service.nodePort }}
      nodePort: {{ .Values.ui.service.nodePort }}
      {{- end }}
  selector:
    {{- include "aisix-cp.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
