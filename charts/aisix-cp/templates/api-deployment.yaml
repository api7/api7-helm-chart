apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aisix-cp.fullname" . }}-api
  labels:
    {{- include "aisix-cp.labels" . | nindent 4 }}
    {{- include "aisix-cp.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "aisix-cp.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aisix-cp.labels" . | nindent 8 }}
        {{- include "aisix-cp.selectorLabels" (dict "root" . "component" "api") | nindent 8 }}
      annotations:
        # Roll the pods when the rendered config file or a value in a Secret
        # this chart renders changes: both are read at boot only. A Secret
        # supplied by name (existingSecret) or rendered by the PostgreSQL
        # subchart is not hashed — restart the Deployment after editing it.
        checksum/config: {{ include (print $.Template.BasePath "/api-configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include "aisix-cp.secretChecksum" . }}
    spec:
      {{- include "aisix-cp.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "aisix-cp.serviceAccountName" . }}
      {{- with .Values.api.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.postgresql.builtin }}
      initContainers:
        {{- include "aisix-cp.pgWaitInitContainer" . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          {{- with .Values.api.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if .Values.api.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.api.metrics.port }}
              protocol: TCP
            {{- end }}
          env:
            {{- include "aisix-cp.env" (dict "chart" (include "aisix-cp.apiEnv" .) "legacy" (include "aisix-cp.legacyEnv.api" .) "extra" (concat (include "aisix-cp.apiEnvFromUI" . | fromYamlArray) (.Values.api.extraEnvVars | default list))) | nindent 12 }}
          # cp-api runs the schema migration (db.OpenAndMigrate) before
          # it binds :8080, so /healthz does not answer for the whole
          # migration. On an upgrade against a populated database that
          # can outlast the liveness budget below and kill the pod
          # MID-MIGRATION. The startupProbe suspends liveness and
          # readiness until the server is actually up.
          #
          # 30 minutes, because a migration that REWRITES a table is
          # bounded by table size, not by a fixed bootstrap cost. The
          # AISIX-Cloud#1288 widening of dpmgr_usage_events.request_id
          # (uuid -> text) measured 6m21s on 10M rows — roughly what 30
          # days of retention holds at a sustained 4 req/s — and it
          # scales linearly from there. The previous 5-minute budget
          # would have turned that upgrade into the exact crash loop
          # this probe exists to prevent.
          #
          # The cost is that a genuinely wedged cp-api goes unrestarted
          # for up to 30 minutes on FIRST start only; once the probe
          # succeeds, the liveness budget below takes over unchanged.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 360
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          {{- with .Values.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: {{ include "aisix-cp.configDir" . }}
              readOnly: true
            {{- with include "aisix-cp.databaseCAVolumeMount" . | trim }}
            {{- . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "aisix-cp.fullname" . }}-api-config
        {{- with include "aisix-cp.databaseCAVolume" . | trim }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- define "aisix-cp.apiEnv" -}}
- name: AISIX_CLOUD_CONFIG_FILE
  value: {{ include "aisix-cp.configDir" . }}/config.yaml
{{- /* Secrets: never in the ConfigMap. The database passwords are
       spliced by cp-api into the password-less DSNs of its config
       file. */}}
- name: AISIX_CLOUD_DATABASE_PASSWORD
  valueFrom:
    secretKeyRef:
      {{- if .Values.twoDSN.enabled }}
      name: {{ include "aisix-cp.servingPasswordSecretName" . }}
      key: {{ include "aisix-cp.servingPasswordSecretKey" . }}
      {{- else }}
      name: {{ include "aisix-cp.pgSecretName" . }}
      key: {{ include "aisix-cp.pgPasswordSecretKey" . }}
      {{- end }}
{{- if .Values.twoDSN.enabled }}
- name: AISIX_CLOUD_ADMIN_DATABASE_PASSWORD
  valueFrom:
    secretKeyRef:
      name: {{ include "aisix-cp.pgSecretName" . }}
      key: {{ include "aisix-cp.pgPasswordSecretKey" . }}
{{- end }}
- name: AISIX_CLOUD_MASTER_KEY
  valueFrom:
    secretKeyRef:
      name: {{ include "aisix-cp.secretName" . }}
      key: master-key
{{- $smtp := .Values.api.smtp | default dict }}
{{- if or $smtp.existingSecret $smtp.password }}
- name: AISIX_CLOUD_SMTP_PASSWORD
  valueFrom:
    secretKeyRef:
      {{- if $smtp.existingSecret }}
      name: {{ $smtp.existingSecret }}
      key: {{ $smtp.existingSecretKey | default "smtp-password" }}
      {{- else }}
      name: {{ include "aisix-cp.secretName" . }}
      key: smtp-password
      {{- end }}
{{- end }}
{{- $billing := .Values.api.billing | default dict }}
{{- $billingKeys := $billing.existingSecretKeys | default dict }}
{{- range list (list "AISIX_STRIPE_SECRET_KEY" "stripeSecretKey" "stripe-secret-key") (list "AISIX_STRIPE_WEBHOOK_SECRET" "stripeWebhookSecret" "stripe-webhook-secret") (list "AISIX_LAGO_API_KEY" "lagoAPIKey" "lago-api-key") }}
{{- $env := index . 0 }}{{ $value := index . 1 }}{{ $chartKey := index . 2 }}
{{- if $billing.existingSecret }}
{{- $key := hasKey $billingKeys $value | ternary (index $billingKeys $value) $chartKey }}
{{- if $key }}
- name: {{ $env }}
  valueFrom:
    secretKeyRef:
      name: {{ $billing.existingSecret }}
      key: {{ $key }}
{{- end }}
{{- else if index $billing $value }}
- name: {{ $env }}
  valueFrom:
    secretKeyRef:
      name: {{ include "aisix-cp.secretName" $ }}
      key: {{ $chartKey }}
{{- end }}
{{- end }}
{{- $bootstrap := .Values.api.bootstrapAdmin | default dict }}
{{- if or $bootstrap.existingSecret (include "aisix-cp.bootstrapAdminPasswordManaged" .) }}
- name: AISIX_CLOUD_BOOTSTRAP_ADMIN_PASSWORD
  valueFrom:
    secretKeyRef:
      {{- if $bootstrap.existingSecret }}
      name: {{ $bootstrap.existingSecret }}
      key: {{ $bootstrap.existingSecretKey | default "bootstrap-admin-password" }}
      {{- else }}
      name: {{ include "aisix-cp.secretName" . }}
      key: bootstrap-admin-password
      {{- end }}
{{- end }}
{{- range (include "aisix-cp.retiredMasterKeys" . | fromJsonArray) }}
- name: AISIX_CLOUD_MASTER_KEY_RETIRED_{{ .envSuffix }}
  valueFrom:
    secretKeyRef:
      name: {{ include "aisix-cp.secretName" $ }}
      key: {{ .secretKey }}
{{- end }}
{{- /* Kept for extraEnvVars written against the pre-config-file
       chart, which could reference $(PGPASSWORD) /
       $(SERVING_PGPASSWORD) in a DSN of their own. */}}
- name: PGPASSWORD
  valueFrom:
    secretKeyRef:
      name: {{ include "aisix-cp.pgSecretName" . }}
      key: {{ include "aisix-cp.pgPasswordSecretKey" . }}
{{- if .Values.twoDSN.enabled }}
- name: SERVING_PGPASSWORD
  valueFrom:
    secretKeyRef:
      name: {{ include "aisix-cp.servingPasswordSecretName" . }}
      key: {{ include "aisix-cp.servingPasswordSecretKey" . }}
{{- end }}
{{- end }}

{{- /*
COMPAT-SINCE: 1.5.0 #1756 — console sign-in moved from the dashboard to cp-api, and a 1.5.0 install was told (NOTES.txt) to put AISIX_TRUSTED_ORIGINS in ui.extraEnvVars (a preview upstream AISIX_AUTH_BEARER_SESSIONS); carry those to cp-api, ahead of api.extraEnvVars and only when that does not set the same name, so an upgraded install keeps its extra sign-in origins. Remove once no supported install can still carry 1.5.0 values.
*/}}
{{- define "aisix-cp.apiEnvFromUI" -}}
{{- $apiNames := list }}
{{- range .Values.api.extraEnvVars }}
{{- $apiNames = append $apiNames .name }}
{{- end }}
{{- $out := list }}
{{- range .Values.ui.extraEnvVars }}
{{- if and (has .name (list "AISIX_TRUSTED_ORIGINS" "AISIX_AUTH_BEARER_SESSIONS")) (not (has .name $apiNames)) }}
{{- $out = append $out . }}
{{- end }}
{{- end }}
{{- toYaml $out }}
{{- end }}
