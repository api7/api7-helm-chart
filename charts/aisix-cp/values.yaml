## @section Global parameters
global:
  # -- StorageClass for the built-in PostgreSQL volume. Empty uses the
  # cluster's default StorageClass
  storageClass: ""
  # -- Image pull secrets applied to every pod created by this chart
  imagePullSecrets: []

## @section cp-api
##
## cp-api serves the Admin API and reverse-proxies the Dashboard, so it is the
## one entry point a browser talks to.
##
## Every application setting of cp-api, dp-manager and the dashboard is a
## value below. The chart renders them into one config file per component
## (a ConfigMap, mounted read-only; a change rolls the pods), and secrets
## reach the pods from Kubernetes Secrets, never through a ConfigMap.
api:
  # -- Number of cp-api replicas
  replicaCount: 1
  image:
    # -- cp-api image repository
    repository: docker.io/api7/aisix-cp-api
    # -- Image pull policy
    pullPolicy: IfNotPresent
    # -- Image tag
    tag: ""  # empty -> .Chart.AppVersion
  service:
    # -- cp-api Service type. ClusterIP keeps it inside the cluster; use
    # NodePort or an Ingress to reach the console from outside
    type: ClusterIP
    # -- cp-api Service port. This port carries both the Admin API and the
    # Dashboard
    port: 8080
    # -- Optional fixed NodePort. Used only when type is NodePort; leave empty
    # to let Kubernetes allocate a port dynamically. Direct NodePort access
    # is plain HTTP, so use a trusted private network or a TLS reverse proxy.
    nodePort: ""
  ## Operator telemetry. Served on its OWN listener, never on the API port:
  ## that one carries the Admin API and proxies the Dashboard and is the
  ## externally reachable entry point, while these are internal operational
  ## numbers (write volumes, resource cardinality). Nothing the Dashboard
  ## shows comes from here. Metric names are the `aisix_cp_` family, so one
  ## Prometheus can hold both planes and tell them apart by prefix.
  metrics:
    # -- Serve Prometheus metrics from cp-api. On by default, matching the
    # gateway chart so both planes are scraped the same way; the port is
    # reachable only inside the cluster (ClusterIP). cp-api binds nothing
    # unless this sets the address, so turning it off leaves the port
    # genuinely unbound inside the pod rather than merely unexposed by
    # the Service.
    enabled: true
    # -- Port the metrics listener binds inside the container
    port: 9090
    service:
      # -- Metrics Service port, on a separate ClusterIP Service so scraping
      # never rides the API Service
      port: 9090
      # -- Extra annotations for the metrics Service, e.g. scrape hints for a
      # Prometheus that discovers by annotation rather than ServiceMonitor
      annotations: {}
    serviceMonitor:
      # -- Create a Prometheus Operator ServiceMonitor for the metrics Service
      enabled: false
      # -- Namespace to create the ServiceMonitor in. Empty uses the release
      # namespace
      namespace: ""
      # -- Scrape interval
      interval: 30s
      # -- Scrape timeout. Empty leaves the Prometheus default
      scrapeTimeout: ""
      # -- Extra labels, e.g. the `release` label your Prometheus selects on
      labels: {}
      # -- Scrape-time relabeling rules
      relabelings: []
      # -- Metric relabeling rules
      metricRelabelings: []
  resources:
    requests:
      # -- cp-api CPU request
      cpu: 100m
      # -- cp-api memory request
      memory: 128Mi
    limits:
      # -- cp-api CPU limit
      cpu: "1"
      # -- cp-api memory limit
      memory: 512Mi
  ## No runAsUser / runAsGroup / fsGroup: the image runs under whatever UID
  ## the platform assigns (OpenShift's restricted-v2 SCC picks a random one),
  ## and nothing here is written to a volume that would need a matching owner.
  ## Set those three keys to pin a fixed UID back.
  podSecurityContext:
    # -- Refuse to run the cp-api pod as root
    runAsNonRoot: true
    seccompProfile:
      # -- Seccomp profile for the cp-api pod
      type: RuntimeDefault
  securityContext:
    # -- Forbid privilege escalation in the cp-api container
    allowPrivilegeEscalation: false
    # -- Mount the cp-api root filesystem read-only
    readOnlyRootFilesystem: true
    capabilities:
      # -- Linux capabilities dropped from the cp-api container
      drop:
        - ALL
  # -- Node selector for the cp-api pod
  nodeSelector: {}
  # -- Tolerations for the cp-api pod
  tolerations: []
  # -- Affinity rules for the cp-api pod
  affinity: {}
  # -- Extra environment for cp-api: system-level settings only (for example
  # TZ). Every cp-api setting has its own value in this section; an env var
  # set here for one of them still overrides the rendered config file, which
  # is how values set this way before those keys existed keep working.
  # Overriding a name the chart itself sets is only a compatibility path for
  # existing deployments. For a name chart 1.5.0 already set, the chart keeps
  # its own entry ahead of yours, so the name appears twice and Helm 4's
  # server-side apply rejects the install. New installs set the value in this
  # file instead.
  extraEnvVars: []
  # -- Publicly reachable cp-api URL. Console sign-in trusts this origin (and
  # its localhost/127.0.0.1 twin), so a value that does not match the address
  # the browser uses breaks sign-in unless that address is in
  # api.trustedOrigins. When api.service.type is NodePort, this must name the
  # API NodePort endpoint (or the TLS reverse proxy in front).
  publicBaseURL: "http://localhost:8080"
  # -- Browser origins allowed to call cp-api cross-origin, as bare origins
  # (scheme://host[:port]). Empty — the default — writes no CORS headers
  # at all, which is what a normal install wants: cp-api serves the API
  # and proxies the dashboard, so the browser has only one origin and
  # nothing is ever cross-origin.
  # Populate it only to let a dashboard served from somewhere else reach
  # this API directly, such as a frontend-only PR preview. An entry is a bare
  # origin (https://host[:port]), or `https://*` plus a suffix naming at least
  # three labels (`https://*-api7ai.vercel.app`) — a PR preview's host carries
  # the branch name, so an exact list would mean redeploying cp-api for every
  # pull request. Read the suffix as collision-resistance, NOT as a guarantee:
  # it is a byte suffix, and on a shared host like `.vercel.app` another
  # account can claim a name ending the same way, so a grant that needs a real
  # boundary belongs on a domain you control. Every entry must be spelled the
  # way a BROWSER serializes an origin, and the chart refuses one that is not,
  # naming the spelling to use — a bare `*`, a path, query, fragment or
  # userinfo, a trailing dot, a non-https origin (loopback may use http), an
  # internationalized host given as anything but punycode, a numeric last
  # label that is not a dotted quad, an IPv6 address in any spelling but the
  # one it is sent in, the scheme's default port written out, a port with a
  # leading zero, and a port above 65535. cp-api applies the same rules at
  # startup, so a value this chart accepts is one it will start with.
  corsAllowedOrigins: []
  # -- dp-manager /dp/* mTLS endpoint that data-plane hosts dial, as baked
  # into the generated install snippets. Also passed to the dpm
  # deployment, which seeds this host into the TLS server certificate it
  # presents — so an IP address works here, not only a DNS name. When
  # dpm.service.type is NodePort, use https://<node-ip>:<dpm-node-port>.
  dpmgrBaseURL: ""
  # -- Gateway image the console hands out in the install snippets it
  # generates for a new data plane. Empty uses cp-api's own default: the
  # gateway of the same release, docker.io/api7/aisix:<cp-api version>, or
  # ghcr.io/api7/aisix:dev on a build that is not a release
  dpImage: ""
  # -- How this control plane is deployed: `on-premises` or `saas`.
  # `on-premises` serves one company's organizations: nobody signs up on
  # their own (accounts come from invitations), organizations cannot be
  # created, billing is off, and cp-api's outbound calls may reach private
  # addresses unless an outbound value below says otherwise. `saas` is the
  # multi-tenant hosted service — open sign-up, organization creation and
  # billing — and requires twoDSN.enabled
  deploymentMode: "on-premises"
  # -- (bool) Whether the dashboard playground may call LLM endpoints on
  # private / internal addresses. Unset follows deploymentMode: allowed
  # on-premises, blocked on saas (SSRF guard). Set true or false to override
  playgroundAllowPrivateIPs: null
  # -- (bool) Whether notification channels (budget alert webhooks / Slack)
  # may deliver to private / internal addresses. Unset follows
  # deploymentMode: allowed on-premises, blocked on saas
  notifyAllowPrivateURLs: null
  # -- (bool) Whether an MCP server's OpenAPI spec_url may be fetched from a
  # private / internal address. Unset follows deploymentMode: allowed
  # on-premises, blocked on saas, where pasting the spec content still works
  mcpSpecAllowPrivateURLs: null
  # -- (bool) Whether the guardrail "test connection" probe may reach plain
  # http, private addresses and non-Azure hosts (an internal or Private Link
  # endpoint). Unset follows deploymentMode: allowed on-premises, blocked on
  # saas
  guardrailTestConnectionAllowInsecure: null
  # -- Let cp-api migrate a database last run by a release older than this one
  # supports upgrading from. cp-api refuses such an upgrade at startup and
  # names the release to pass through first; set this only after reading that
  # message and taking a database backup, then set it back.
  allowUnsupportedUpgrade: false
  # -- Extra origins the console accepts sign-in from, as bare origins
  # (https://host[:port]) or `https://*<suffix>` patterns. The
  # api.publicBaseURL origin and its loopback twin are always trusted; add
  # another hostname of this console here, or the local address of a
  # port-forward that differs from api.publicBaseURL. An entry cp-api cannot
  # read as an origin is logged and ignored.
  trustedOrigins: []
  # -- Reverse proxies (CIDRs, e.g. `10.0.0.0/8`) in front of cp-api whose
  # X-Forwarded-For cp-api believes. Console sign-in and password reset
  # rate limiting, and the client address recorded on a session,
  # then use the first address from
  # the right that is not one of these proxies. Empty — the default — uses
  # the address of whatever connected to cp-api, so behind an ingress every
  # client shares the ingress's rate-limit budget. List only proxies you
  # run: a range listed here can name any client address it likes.
  trustedProxies: []
  # -- Hand the session token to a cross-site console client (a
  # frontend-only PR preview) and accept it back in an Authorization header.
  # Leave off for a normal install: it exposes the session token to page
  # scripts.
  bearerSessions: false
  # -- Model-pricing catalog URL cp-api syncs from (the models.dev api.json
  # format). Empty uses the public models.dev endpoint; point it at an
  # internal mirror when cp-api has no internet access. Ignored when
  # pricesyncSnapshotPath is set
  pricesyncURL: ""
  # -- Offline pricing: seed the catalog once at startup from this
  # models.dev api.json capture (plain or .gz) and never fetch. The cp-api
  # image ships one at /etc/aisix/models-dev-snapshot.json.gz. Empty selects
  # online sync, which loads that bundled snapshot when a sync fails while
  # the catalog is still empty (an install without internet access), keeps
  # an existing catalog, and refreshes every model a later sync returns
  pricesyncSnapshotPath: ""

  ## The first administrator of an on-premises install. When cp-api starts
  ## on a database with no users yet, it creates the organization `Default`
  ## (rename it later in the organization settings) with this account as its
  ## owner, who must change the password at the first sign-in. It happens
  ## once: changing these afterwards changes nothing. Restoring an
  ## organization bundle onto a fresh install is done by this administrator
  ## too. Set email to "" to create no administrator. Ignored when
  ## deploymentMode is saas.
  ##
  ## With neither password nor existingSecret, the chart generates a random
  ## password into its own Secret (key bootstrap-admin-password) and keeps it
  ## across `helm upgrade` by reading that Secret back with `lookup`; the
  ## install notes print the command that reads it. `helm template` and
  ## GitOps renderers such as Argo CD cannot `lookup`, so they would generate
  ## a new password on every render: those deployments must set password or
  ## existingSecret explicitly.
  bootstrapAdmin:
    # -- Email of the first administrator
    email: "admin@example.com"
    # -- Initial password (12 to 128 characters), stored in the chart's
    # Secret. Ignored when existingSecret is set. Empty generates one (see
    # above)
    password: ""
    # -- Name of an existing Secret holding the initial password instead of
    # the password value above
    existingSecret: ""
    # -- Key inside bootstrapAdmin.existingSecret holding the password
    existingSecretKey: "bootstrap-admin-password"

  ## Billing — SaaS only. On-premises (api.deploymentMode: on-premises) has
  ## no billing, and the chart refuses to render with a provider other than
  ## `mock` or with usagePush on, as cp-api refuses to start. Every value
  ## here is left out of cp-api's config file while it is empty.
  # @ignored
  billing:
    # -- Billing provider: `stripe`, or `mock` for a provider that accepts
    # every change without charging. Empty turns billing off
    provider: ""
    # -- Push metered usage to the Lago endpoint below
    usagePush: false
    # -- Stripe Billing customer-portal configuration id (`bpc_...`)
    stripePortalConfigID: ""
    # -- Lago API endpoint usage is pushed to
    lagoEndpoint: ""
    # -- Stripe secret API key, stored in the chart's Secret. Ignored when
    # existingSecret is set
    stripeSecretKey: ""
    # -- Stripe webhook signing secret, stored in the chart's Secret.
    # Ignored when existingSecret is set
    stripeWebhookSecret: ""
    # -- Lago API key, stored in the chart's Secret. Ignored when
    # existingSecret is set
    lagoAPIKey: ""
    # -- Name of an existing Secret holding the three billing secrets
    # instead of the values above
    existingSecret: ""
    # -- Keys inside billing.existingSecret. Set a key to "" when the
    # Secret does not hold that value; every other key must exist
    existingSecretKeys:
      stripeSecretKey: "stripe-secret-key"
      stripeWebhookSecret: "stripe-webhook-secret"
      lagoAPIKey: "lago-api-key"

  ## Organization creation — SaaS only; on-premises creates no organizations.
  # @ignored
  organization:
    # -- Every new organization needs a one-time invite code, including a
    # second one by an existing owner. An operator issues codes inside the
    # cp-api pod: `kubectl exec deploy/<release>-aisix-cp-api -- cp-api
    # invite-code create --note <who it is for>` (also `list`, `revoke`).
    # Signing up and joining an organization through a member invitation
    # need no code. Set false to let anyone who signs up create
    # organizations
    requireInviteCode: true

  ## Organization domain verification — SaaS only. An organization owner
  ## proves the organization controls a domain by publishing a DNS TXT
  ## record; cp-api looks it up when the owner verifies and about once a
  ## day after that.
  # @ignored
  domainVerification:
    # -- DNS server (`host:port`) the TXT lookups are sent to. Empty uses
    # the resolver the cp-api pod is configured with
    dnsServer: ""

  ## Outbound email. cp-api sends invitation emails, password reset emails
  ## and sign-up verification emails through this relay. Email is off until
  ## `host` is set; the console then shows invitation links to pass on by
  ## hand and asks users who forgot their
  ## password to contact an administrator. `deploymentMode: saas` requires
  ## `host`: every new account confirms its address by email before it can
  ## sign in, and the chart refuses to render without a relay.
  ## Deployments with open public sign-up should keep invitationLimitPerHour
  ## in place: it is what stops any sign-up from mailing arbitrary addresses
  ## through the relay.
  smtp:
    # -- SMTP relay host name. Empty disables email
    host: ""
    # -- SMTP relay port. 0 uses the default for the TLS mode: 587 for
    # starttls, 465 for smtps, 25 for none
    port: 0
    # -- How the connection is protected: `starttls` (plain connection
    # upgraded with STARTTLS; refused if the relay does not offer it),
    # `smtps` (TLS from the first byte) or `none` (never encrypted). The
    # relay's certificate is always verified against the system roots
    tls: "starttls"
    # -- Sender address of every email, e.g. `AISIX <noreply@example.com>`.
    # Required when host is set
    from: ""
    # -- Username for SMTP authentication. Set together with a password
    # (password or existingSecret), or leave both empty to send without
    # authenticating. With tls `none` the credentials cross the network
    # unencrypted
    username: ""
    # -- SMTP password, stored in the chart's Secret. Ignored when
    # existingSecret is set
    password: ""
    # -- Name of an existing Secret holding the SMTP password instead of
    # the password value above
    existingSecret: ""
    # -- Key inside smtp.existingSecret holding the password
    existingSecretKey: "smtp-password"
    # -- Most invitation emails one inviter account may send per rolling
    # hour, across every organization; creating and resending an invitation
    # both count, and one over the limit is refused (HTTP 429) with nothing
    # created. Counted only while email is on. Keep it in place on a
    # deployment with open public sign-up: anyone can create an organization
    # there, and would otherwise send unlimited mail through your relay
    invitationLimitPerHour: 50

  ## Audit log retention. Audit events older than this are deleted by a
  ## daily job; the audit log in the console and the Admin API only ever
  ## shows what is kept.
  audit:
    # -- Days an audit event is kept before it is deleted. 0 keeps audit
    # events forever
    retentionDays: 730

## @section dp-manager
##
## dp-manager terminates the mTLS connection every gateway dials and serves it
## the configuration cp-api projects. Gateways reach this endpoint directly, so
## it is the one component that needs to be reachable from wherever they run.
dpm:
  # -- Number of dp-manager replicas
  replicaCount: 1
  image:
    # -- dp-manager image repository
    repository: docker.io/api7/aisix-cp-dpm
    # -- Image pull policy
    pullPolicy: IfNotPresent
    # -- Image tag
    tag: ""  # empty -> .Chart.AppVersion
  service:
    # -- dp-manager Service type. Use NodePort or a LoadBalancer when the
    # gateways run outside this cluster
    type: ClusterIP
    # -- dp-manager mTLS Service port, the one gateways dial
    port: 7944
    # -- Plain-HTTP listen address for /healthz (outbox-poller liveness),
    # probed by the kubelet (the mTLS port 7944 cannot be probed). Set to
    # "" to disable the health server + httpGet probes (the probes then
    # fall back to a TCP check on the mTLS port).
    healthListen: ":7946"
    # -- Optional fixed NodePort for the mTLS port. Used only when type is
    # NodePort; leave empty to let Kubernetes allocate one
    nodePort: ""
  resources:
    requests:
      # -- dp-manager CPU request
      cpu: 100m
      # -- dp-manager memory request
      memory: 128Mi
    limits:
      # -- dp-manager CPU limit
      cpu: "1"
      # -- dp-manager memory limit
      memory: 512Mi
  ## No runAsUser / runAsGroup / fsGroup: the image runs under whatever UID
  ## the platform assigns (OpenShift's restricted-v2 SCC picks a random one),
  ## and nothing here is written to a volume that would need a matching owner.
  ## Set those three keys to pin a fixed UID back.
  podSecurityContext:
    # -- Refuse to run the dp-manager pod as root
    runAsNonRoot: true
    seccompProfile:
      # -- Seccomp profile for the dp-manager pod
      type: RuntimeDefault
  securityContext:
    # -- Forbid privilege escalation in the dp-manager container
    allowPrivilegeEscalation: false
    # -- Mount the dp-manager root filesystem read-only
    readOnlyRootFilesystem: true
    capabilities:
      # -- Linux capabilities dropped from the dp-manager container
      drop:
        - ALL
  # -- Node selector for the dp-manager pod
  nodeSelector: {}
  # -- Tolerations for the dp-manager pod
  tolerations: []
  # -- Affinity rules for the dp-manager pod
  affinity: {}
  # -- Extra environment for dp-manager: system-level settings only (for
  # example TZ). An env var set here for a dp-manager setting still
  # overrides the rendered config file.
  # Overriding a name the chart itself sets is only a compatibility path for
  # existing deployments. For a name chart 1.5.0 already set, the chart keeps
  # its own entry ahead of yours, so the name appears twice and Helm 4's
  # server-side apply rejects the install. New installs set the value in this
  # file instead.
  extraEnvVars: []

## @section dashboard
##
## The console. cp-api serves it from its own image, so there is no separate
## dashboard Deployment: the console is reached wherever the api Service is.
ui:
  # -- Fixed language for this deployment. Supported: "en", "zh". There is
  # no in-UI language switcher; the whole console renders in this locale
  # (default English), and the emails cp-api sends are written in it too.
  defaultLocale: "en"
  ## Chart 1.5.0 ran the dashboard behind its own Service, and a same-origin
  ## proxy may still send pages to it. The Service stays, under the same
  ## name, and now reaches cp-api, which serves the console at every path —
  ## so pointing such a proxy (or anything else) at the api Service instead
  ## is equivalent. New installs do not need it.
  service:
    # -- Type of the dashboard Service kept from chart 1.5.0
    type: ClusterIP
    # -- Port of the dashboard Service kept from chart 1.5.0; it forwards to cp-api
    port: 3000
    # -- Optional fixed NodePort. Used only when type is NodePort; leave empty
    # to let Kubernetes allocate a port dynamically. This plain-HTTP endpoint
    # reaches cp-api exactly as the api Service does; terminate TLS in front
    # of it unless it is on a trusted network.
    nodePort: ""
  # -- Kept for installs upgraded from chart 1.5.0, which ran a separate
  # dashboard. Of what that release was told to set here, AISIX_TRUSTED_ORIGINS
  # and AISIX_AUTH_BEARER_SESSIONS are carried to cp-api (unless
  # api.extraEnvVars sets the same name); nothing else is read. Set
  # api.extraEnvVars instead.
  extraEnvVars: []

## @section ServiceAccount
serviceAccount:
  # -- Create a ServiceAccount for the control-plane pods
  create: true
  # -- Name of the ServiceAccount. Empty derives one from the release name;
  # set it to use a ServiceAccount you manage yourself (create: false)
  name: ""
  # -- Annotations for the ServiceAccount, e.g. a cloud IAM role binding
  annotations: {}

## @section Secrets
##
## REQUIRED. The chart refuses to render while the master key carries its
## CHANGE_ME placeholder, so an install cannot come up with a known secret. It
## has to stay the same for the life of the deployment: the master key is the
## only thing that can decrypt the provider keys stored under it. Keep it
## somewhere you can restore from.
secrets:
  # -- REQUIRED. Base64-encoded 32-byte AES-256 key that envelope-encrypts the
  # stored upstream provider credentials. Generate with
  # `openssl rand -base64 32`. It is the only thing that can decrypt what was
  # stored under it, so a lost key means re-entering every provider key
  masterKey: "CHANGE_ME_GENERATE_WITH_openssl_rand_-base64_32"
  # -- Identifier recorded alongside every value encrypted with the current
  # master key, so a future key rotation can tell the generations apart
  masterKeyID: "env:default"
  # -- Decrypt-only master keys during a master-key rotation, as
  # `<masterKeyID>: <base64 key>` — the id the key was recorded under
  # (lowercase letters, digits, ":" and "-") and the key itself. Rotate by
  # moving the current masterKey / masterKeyID here and setting new ones;
  # remove an entry once nothing is encrypted under it any more
  retiredMasterKeys: {}

## @section PostgreSQL
##
## Set builtin=true to deploy the bundled PostgreSQL subchart. Set
## builtin=false and configure externalDatabase to use a PostgreSQL instance
## you run yourself. The api and dpm pods wait for PostgreSQL only in builtin
## mode; an external database must be ready before the control plane starts.
##
## The bundled subchart pins a UID of its own — fsGroup 1001 in
## primary.podSecurityContext and runAsUser 1001 in
## primary.containerSecurityContext, both behind `enabled: true`. A subchart's
## values cannot be made conditional from here, so on a platform that assigns
## the UID itself (OpenShift's restricted-v2 SCC) turn those two off at install
## time:
##
##   --set postgresql.primary.podSecurityContext.enabled=false \
##   --set postgresql.primary.containerSecurityContext.enabled=false
##
## Nothing else needs disabling. volumePermissions (the root chown init
## container) is already off by default, and the /dev/shm emptyDir needs no
## fsGroup — the kubelet mounts it world-writable. Turning shmVolume off would
## drop PostgreSQL back to the runtime's 64Mi /dev/shm and break parallel
## query with "could not resize shared memory segment".
##
postgresql:
  # -- Deploy the bundled PostgreSQL subchart. Set to false to point the
  # control plane at the database configured under externalDatabase
  builtin: true
  # -- Override the generated name of the PostgreSQL resources
  fullnameOverride: ""
  ## Also used by the wait-for-pg init container on the api and dpm pods, which
  ## carries no securityContext of its own: since the chart supplies no
  ## runAsUser, `runAsNonRoot: true` is checked against THIS image's USER, and a
  ## replacement that runs as root (or names its user) is refused at admission.
  image:
    # -- PostgreSQL image registry
    registry: docker.io
    # -- PostgreSQL image repository
    repository: api7/postgresql
    # -- PostgreSQL image tag
    tag: 15.4.0-debian-11-r45
  primary:
    persistence:
      # -- Size of the PostgreSQL data volume. It holds every configured
      # resource plus the request telemetry the console reports on
      size: 8Gi
    service:
      ports:
        # -- PostgreSQL Service port
        postgresql: 5432
  auth:
    # -- Use the built-in PostgreSQL superuser for application connections.
    # cp-api currently runs schema and role migrations on startup, including
    # ALTER ROLE statements that require superuser privileges.
    usePostgresUserForAppConnections: true
    # -- Application database role cp-api connects as when
    # usePostgresUserForAppConnections is false
    username: aisix
    # -- Inject DB credentials from a pre-created Secret instead of the values
    # below (the secure path). When set, the password fields are ignored and
    # the placeholder rejection is skipped.
    existingSecret: ""
    # -- REQUIRED with builtin=true (unless existingSecret is set). Password
    # for the application role. The chart REJECTS the default `changeme` at
    # render time. Generate a URL-SAFE value with `openssl rand -hex 24`: the
    # password is embedded in a `postgres://` DSN, so the `+`, `/` and `=`
    # that `openssl rand -base64` produces corrupt URL parsing. PostgreSQL
    # bakes it into the data volume on first init, so it has to stay the same
    # across re-deploys
    password: changeme
    # -- REQUIRED with builtin=true (unless existingSecret is set). Password
    # for the PostgreSQL superuser, under the same URL-safe rule and the same
    # placeholder rejection as `password` above
    postgresPassword: changeme
    # -- Database name the control plane uses
    database: aisix_cloud

## @section External Database
##
## Read only when postgresql.builtin is false.
externalDatabase:
  # -- PostgreSQL host
  host: ""
  # -- PostgreSQL port
  port: 5432
  # -- Database role the control plane connects as. It has to be able to run
  # the schema migrations cp-api applies at startup
  username: aisix
  # -- Database name
  database: aisix_cloud
  # -- Name of an existing Secret containing the database password (key: "password").
  existingSecret: ""
  # -- If existingSecret is empty, this password is used directly. Use a
  # URL-safe value: it is embedded in a `postgres://` DSN
  password: ""
  # -- libpq sslmode for the connection, e.g. `require` or `verify-full` for a
  # managed database reached over a network you do not control. `verify-ca` and
  # `verify-full` check the server certificate against the image's system trust
  # store unless `sslRootCert` supplies the CA, which a database whose
  # certificate is issued by a private CA (most managed databases) needs. With
  # `sslRootCert` set, `require` verifies the CA too (libpq semantics)
  sslmode: disable
  sslRootCert:
    # -- Name of an existing Secret holding the PEM CA bundle that issued the
    # database server's certificate. Mounted read-only into cp-api and
    # dp-manager and used as libpq `sslrootcert` for every database connection
    # they open. Empty leaves verification to the system trust store
    existingSecret: ""
    # -- Key in that Secret holding the CA bundle
    key: ca.crt

## @section Two-DSN tenant isolation (SaaS / multi-tenant only)
##
## When enabled, cp-api opens TWO pools against the same database:
##   - an admin pool on the privileged DSN above (builtin postgres or the
##     externalDatabase user) that runs migrations + the cross-tenant paths;
##   - a serving pool that connects AS the non-superuser `cp_api_app` role,
##     so every tenant query is Row-Level-Security filtered and a path that
##     forgets to scope fails closed (zero rows) instead of leaking.
## cp-api provisions cp_api_app's LOGIN + password (from servingPassword)
## on the admin pool at boot — you do NOT pre-create the role.
##
## Leave DISABLED for single-tenant / private (On-Premises) deployments: there
## every organization is one trust domain, RLS is inert, and the single
## privileged DSN handles everything.
twoDSN:
  # -- Open a second, Row-Level-Security-enforced pool for tenant queries.
  # Leave off for an On-Premises deployment
  enabled: false
  # -- Password cp-api assigns to the cp_api_app serving role and uses in the
  # serving DSN. Required when enabled unless existingSecret is set.
  # Use a URL-safe value, from `openssl rand -hex 24`: it is embedded in a
  # `postgres://` DSN, so `+`, `/` and `=` corrupt URL parsing
  servingPassword: ""
  # -- Optionally source the serving password from an existing Secret instead
  # of servingPassword above. Key defaults to "serving-password".
  existingSecret: ""
  # -- Key inside twoDSN.existingSecret holding the serving password
  existingSecretKey: "serving-password"
