## @section Global parameters
global:
  storageClass: ""
  imagePullSecrets: []

## @section cp-api
api:
  replicaCount: 1
  image:
    repository: docker.io/api7/aisix-cp-api
    pullPolicy: IfNotPresent
    tag: ""  # empty -> .Chart.AppVersion
  service:
    type: ClusterIP
    port: 8080
    ## Optional fixed NodePort. Used only when type is NodePort; leave empty
    ## to let Kubernetes allocate a port dynamically. Direct NodePort access
    ## is plain HTTP, so use a trusted private network or a TLS reverse proxy.
    nodePort: ""
  ## Operator telemetry. Served on its OWN listener, never on the API port:
  ## that one carries the Admin API and proxies the Dashboard and is the
  ## externally reachable entry point, while these are internal operational
  ## numbers (write volumes, resource cardinality). Nothing the Dashboard
  ## shows comes from here. Metric names are the `aisix_cp_` family, so one
  ## Prometheus can hold both planes and tell them apart by prefix.
  metrics:
    ## Serve Prometheus metrics from cp-api. On by default, matching the
    ## gateway chart so both planes are scraped the same way; the port is
    ## reachable only inside the cluster (ClusterIP). cp-api binds nothing
    ## unless this sets the address, so turning it off leaves the port
    ## genuinely unbound inside the pod rather than merely unexposed by
    ## the Service.
    enabled: true
    ## Port the metrics listener binds inside the container
    port: 9090
    service:
      ## Metrics Service port, on a separate ClusterIP Service so scraping
      ## never rides the API Service
      port: 9090
      ## Extra annotations for the metrics Service, e.g. scrape hints for a
      ## Prometheus that discovers by annotation rather than ServiceMonitor
      annotations: {}
    serviceMonitor:
      ## Create a Prometheus Operator ServiceMonitor for the metrics Service
      enabled: false
      ## Namespace to create the ServiceMonitor in. Empty uses the release namespace
      namespace: ""
      ## Scrape interval
      interval: 30s
      ## Scrape timeout. Empty leaves the Prometheus default
      scrapeTimeout: ""
      ## Extra labels, e.g. the `release` label your Prometheus selects on
      labels: {}
      ## Scrape-time relabeling rules
      relabelings: []
      ## Metric relabeling rules
      metricRelabelings: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  ## No runAsUser / runAsGroup / fsGroup: the image runs under whatever UID
  ## the platform assigns (OpenShift's restricted-v2 SCC picks a random one),
  ## and nothing here is written to a volume that would need a matching owner.
  ## Set those three keys to pin a fixed UID back.
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  nodeSelector: {}
  tolerations: []
  affinity: {}
  ## Extra environment for cp-api. This is also where
  ## AISIX_ALLOW_UNSUPPORTED_UPGRADE=1 goes when an upgrade has to proceed
  ## from a release older than this one supports upgrading from — cp-api
  ## refuses that upgrade at startup and names the version it needs.
  extraEnvVars: []
  ## Publicly reachable cp-api URL. When api.service.type is NodePort, this
  ## must name the API NodePort endpoint (or the TLS reverse proxy in front).
  publicBaseURL: "http://localhost:8080"
  ## Browser origins allowed to call cp-api cross-origin, as bare origins
  ## (scheme://host[:port]). Empty — the default — writes no CORS headers
  ## at all, which is what a normal install wants: cp-api serves the API
  ## and proxies the dashboard, so the browser has only one origin and
  ## nothing is ever cross-origin.
  ##
  ## Populate it only to let a dashboard served from somewhere else reach
  ## this API directly, such as a frontend-only PR preview.
  ##
  ## An entry is a bare origin (https://host[:port]), or `https://*` plus a
  ## suffix — a PR preview's host carries the branch name, so an exact list
  ## would mean redeploying cp-api for every pull request:
  ##
  ##   corsAllowedOrigins:
  ##     - https://*-api7ai.vercel.app
  ##
  ## Read the suffix as collision-resistance, NOT as a guarantee. It is a
  ## byte suffix: "-" is legal inside a DNS label rather than a separator,
  ## and a .vercel.app name is allocated first-come-first-served from a
  ## project name its owner picks, so another account can claim one ending
  ## the same way. A grant that needs a real boundary belongs on a domain
  ## you control — point previews at one with Vercel's preview deployment
  ## suffix and allowlist https://*.preview.<your-domain>.
  ##
  ## The governing rule: an entry must be spelled the way a BROWSER
  ## serializes an origin. Anything that parses but serializes differently
  ## could never equal an Origin header, so it is refused here with the
  ## spelling to use rather than accepted as an entry that quietly matches
  ## nothing. cp-api applies the same rules at startup, so a value this
  ## chart accepts is one it will start with.
  ##
  ## Refused: bare "*", a suffix not starting with "-" or ".", a suffix
  ## naming fewer than three labels (https://*.vercel.app would cover every
  ## project on that host), anything carrying a path, query, fragment or
  ## userinfo, a trailing dot, any non-https origin (loopback may use
  ## http), an internationalized host given as anything but its punycode
  ## form, a host whose last label is numeric without being a dotted quad
  ## (a browser re-reads https://2130706433 as https://127.0.0.1), an IPv6
  ## address written in any spelling but the one it is sent in, the
  ## scheme's default port written out (":443" on https), a port carrying
  ## a leading zero, and a port above 65535.
  corsAllowedOrigins: []
  ## dp-manager /dp/* mTLS endpoint that data-plane hosts dial, as baked
  ## into the generated install snippets. Also passed to the dpm
  ## deployment, which seeds this host into the TLS server certificate it
  ## presents — so an IP address works here, not only a DNS name. When
  ## dpm.service.type is NodePort, use https://<node-ip>:<dpm-node-port>.
  dpmgrBaseURL: ""
  oauthEnabled: false
  dpImage: ""  # empty -> docker.io/api7/aisix:<appVersion>
  ## Allow the dashboard playground to reach LLM endpoints on private /
  ## internal networks. cp-api blocks private IPs by default (SSRF guard);
  ## enable this only for On-Premises deployments whose models live on an
  ## internal network the cp-api pod can route to.
  playgroundAllowPrivateIPs: false
  ## Allow notification channels (budget alert webhooks / Slack) to point
  ## at private / internal addresses. Blocked by default (SSRF guard);
  ## enable only for On-Premises deployments whose webhook receivers live
  ## on an intranet the cp-api pod can route to.
  notifyAllowPrivateURLs: false

## @section dp-manager
dpm:
  replicaCount: 1
  image:
    repository: docker.io/api7/aisix-cp-dpm
    pullPolicy: IfNotPresent
    tag: ""  # empty -> .Chart.AppVersion
  service:
    type: ClusterIP
    port: 7944
    # Plain-HTTP listen address for /healthz (outbox-poller liveness),
    # probed by the kubelet (the mTLS port 7944 cannot be probed). Set to
    # "" to disable the health server + httpGet probes (the probes then
    # fall back to a TCP check on the mTLS port).
    healthListen: ":7946"
    nodePort: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  ## No runAsUser / runAsGroup / fsGroup: the image runs under whatever UID
  ## the platform assigns (OpenShift's restricted-v2 SCC picks a random one),
  ## and nothing here is written to a volume that would need a matching owner.
  ## Set those three keys to pin a fixed UID back.
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnvVars: []

## @section dashboard (Next.js)
ui:
  replicaCount: 1
  # Fixed dashboard UI language for this deployment. Supported: "en", "zh".
  # There is no in-UI language switcher; the whole console renders in this
  # locale (default English). Read server-side at request time.
  defaultLocale: "en"
  image:
    repository: docker.io/api7/aisix-cp-ui
    pullPolicy: IfNotPresent
    tag: ""  # empty -> .Chart.AppVersion
  service:
    type: ClusterIP
    port: 3000
    ## Optional fixed NodePort. Used only when type is NodePort; leave empty
    ## to let Kubernetes allocate a port dynamically. This plain-HTTP endpoint
    ## is not a standalone Dashboard entry point: use it only behind a
    ## same-origin reverse proxy that sends Dashboard pages here and /api/* to
    ## cp-api. The proxy should terminate TLS unless it is on a trusted network.
    nodePort: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  ## No runAsUser / runAsGroup / fsGroup: the image runs under whatever UID
  ## the platform assigns (OpenShift's restricted-v2 SCC picks a random one).
  ## The .next/cache emptyDir needs no fsGroup to be writable — the kubelet
  ## creates it world-writable. Set those three keys to pin a fixed UID back.
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnvVars: []
  # -- Additional volumes for the dashboard Pod (for example, a private database CA).
  extraVolumes: []
  # -- Additional mounts for the dashboard container. Use readOnly for CA certificates.
  extraVolumeMounts: []

## @section ServiceAccount
serviceAccount:
  create: true
  name: ""
  annotations: {}

## @section Secrets
## IMPORTANT: You MUST replace the placeholder values below before deploying.
## Deploying with CHANGE_ME placeholders will fail at helm render/install time.
##
## masterKey: base64-encoded 32-byte AES-256 key for envelope encryption.
##   Generate with: openssl rand -base64 32
## betterAuthSecret: random string used as HMAC signing secret for Better Auth sessions.
##   Generate with: openssl rand -base64 48
secrets:
  masterKey: "CHANGE_ME_GENERATE_WITH_openssl_rand_-base64_32"
  masterKeyID: "env:default"
  betterAuthSecret: "CHANGE_ME_GENERATE_WITH_openssl_rand_-base64_48"

## @section PostgreSQL
## Set builtin=true to deploy Bitnami PostgreSQL subchart.
## Set builtin=false and configure externalDatabase to use an existing PostgreSQL instance.
## API/DPM wait for PostgreSQL only in builtin mode.
## An external database must be ready before starting the control plane.
##
## The bundled Bitnami subchart pins a UID of its own — fsGroup 1001 in
## primary.podSecurityContext and runAsUser 1001 in
## primary.containerSecurityContext, both behind `enabled: true`. A subchart's
## values cannot be made conditional from here, so on a platform that assigns
## the UID itself (OpenShift's restricted-v2 SCC) turn those two off at install
## time:
##
##   --set postgresql.primary.podSecurityContext.enabled=false \
##   --set postgresql.primary.containerSecurityContext.enabled=false
##
## Nothing else needs disabling. volumePermissions (the root chown init
## container) is already off by default, and the /dev/shm emptyDir needs no
## fsGroup — the kubelet mounts it world-writable. Turning shmVolume off would
## drop PostgreSQL back to the runtime's 64Mi /dev/shm and break parallel
## query with "could not resize shared memory segment".
##
postgresql:
  builtin: true
  fullnameOverride: ""
  ## Also used by the wait-for-pg init container on the api and dpm pods, which
  ## carries no securityContext of its own: since the chart supplies no
  ## runAsUser, `runAsNonRoot: true` is checked against THIS image's USER, and a
  ## replacement that runs as root (or names its user) is refused at admission.
  image:
    registry: docker.io
    repository: api7/postgresql
    tag: 15.4.0-debian-11-r45
  primary:
    persistence:
      size: 8Gi
    service:
      ports:
        postgresql: 5432
  auth:
    ## Use the built-in PostgreSQL superuser for application connections.
    ## cp-api currently runs schema and role migrations on startup, including
    ## ALTER ROLE statements that require superuser privileges.
    usePostgresUserForAppConnections: true
    username: aisix
    ## Inject DB credentials from a pre-created Secret instead of the values
    ## below (the secure path). When set, the password fields are ignored and
    ## the placeholder rejection is skipped.
    existingSecret: ""
    ## IMPORTANT: Set a stable password before deploying.
    ## If left as default, the password is baked into the PG data volume on first init
    ## and must remain unchanged across re-deploys.
    ## The chart REJECTS the default 'changeme' at render/install time when
    ## postgresql.builtin=true — set a real password (openssl rand -hex 24).
    ## Use a URL-safe value: the password is embedded in a postgres:// DSN,
    ## so + / = (as produced by `openssl rand -base64`) corrupt URL parsing.
    ## Or use existingSecret above.
    password: changeme
    postgresPassword: changeme
    database: aisix_cloud

## @section External Database
## Only used when postgresql.builtin is false.
externalDatabase:
  host: ""
  port: 5432
  username: aisix
  database: aisix_cloud
  ## Name of an existing Secret containing the database password (key: "password").
  existingSecret: ""
  ## If existingSecret is empty, this password is used directly.
  password: ""
  sslmode: disable

## @section Two-DSN tenant isolation (SaaS / multi-tenant only)
## When enabled, cp-api opens TWO pools against the same database:
##   - an admin pool on the privileged DSN above (builtin postgres or the
##     externalDatabase user) that runs migrations + the cross-tenant paths;
##   - a serving pool that connects AS the non-superuser `cp_api_app` role,
##     so every tenant query is Row-Level-Security filtered and a path that
##     forgets to scope fails closed (zero rows) instead of leaking.
## cp-api provisions cp_api_app's LOGIN + password (from servingPassword)
## on the admin pool at boot — you do NOT pre-create the role.
##
## Leave DISABLED for single-tenant / private (OP) deployments: there every
## org is one trust domain, RLS is inert, and the single privileged DSN
## handles everything (the current default behavior). See the internal
## docs/rls-architecture.md for the full model.
twoDSN:
  enabled: false
  ## Password cp-api assigns to the cp_api_app serving role and uses in the
  ## serving DSN. Required when enabled unless existingSecret is set.
  ## Use a URL-safe value (no + / =): it is embedded in a postgres:// DSN.
  servingPassword: ""
  ## Optionally source the serving password from an existing Secret instead
  ## of servingPassword above. Key defaults to "serving-password".
  existingSecret: ""
  existingSecretKey: "serving-password"
