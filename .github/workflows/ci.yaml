name: CI

on:
  pull_request:
    branches:
      - "main"
      - "release/**"
  push:
    branches:
      - "main"
      - "release/**"

jobs:

  helm:
    name: Helm chart
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Lint
        run: |
          docker run --rm --interactive --network host \
              --name ct-lint \
              --volume $PWD:/workdir \
              --workdir /workdir \
              quay.io/helmpack/chart-testing:v3.10.1 sh -c 'git config --global --add safe.directory /workdir \
               && helm repo add bitnami https://charts.bitnami.com/bitnami \
               && helm repo add jaegertracing https://jaegertracing.github.io/helm-charts \
               && ct lint \
                  --charts charts/api7 \
                  --charts charts/gateway \
                  --charts charts/ingress-controller \
                  --charts charts/aisix-cp \
                  --charts charts/aisix \
                  --charts charts/developer-portal-fe \
                  --charts charts/ngxdig'

      - name: Verify Chart.lock files
        run: |
          docker run --rm --interactive --network host \
              --volume "$PWD:/workdir" \
              --workdir /workdir \
              quay.io/helmpack/chart-testing:v3.10.1 sh -c '
                helm repo add bitnami https://charts.bitnami.com/bitnami && \
                helm repo add jaegertracing https://jaegertracing.github.io/helm-charts && \
                for chart_dir in charts/*/; do
                  if [ -f "${chart_dir}Chart.lock" ]; then
                    echo "Verifying ${chart_dir}Chart.lock..."
                    helm dependency build "${chart_dir}"
                  fi
                done
              '

      - name: Setup Kubernetes
        uses: helm/kind-action@v1
        with:
          version: v0.22.0
          node_image: kindest/node:v1.31.0

      - name: Test install charts
        run: |
          kubectl cluster-info
          docker run --rm --interactive --network host \
              --name ct \
              --volume $HOME/.kube/config:/root/.kube/config \
              --volume $PWD:/workdir \
              --workdir /workdir \
              quay.io/helmpack/chart-testing:v3.10.1 sh -c 'git config --global --add safe.directory /workdir \
               && helm repo add bitnami https://charts.bitnami.com/bitnami \
               && helm repo add jaegertracing https://jaegertracing.github.io/helm-charts \
               && ct install \
                  --charts charts/api7 \
                  --charts charts/ingress-controller \
                  --charts charts/ngxdig'

      - name: Test gateway charts
        run: |
          kubectl cluster-info
          docker run --rm --interactive --network host \
              --name ct \
              --volume $HOME/.kube/config:/root/.kube/config \
              --volume $PWD:/workdir \
              --workdir /workdir \
              quay.io/helmpack/chart-testing:v3.10.1 sh -c 'git config --global --add safe.directory /workdir \
               && helm repo add bitnami https://charts.bitnami.com/bitnami \
               && helm repo add jaegertracing https://jaegertracing.github.io/helm-charts \
               && ct install \
                  --charts charts/gateway --helm-extra-set-args "--set etcd.enabled=true --set apisix.extraEnvVars[0].name=API7_SKIP_FIRST_HEARTBEAT_DEBUG --set-string apisix.extraEnvVars[0].value=true"'

      - name: Test aisix chart in standalone mode
        run: |
          kubectl cluster-info
          docker run --rm --interactive --network host \
              --name ct-aisix-standalone \
              --volume $HOME/.kube/config:/root/.kube/config \
              --volume $PWD:/workdir \
              --workdir /workdir \
              quay.io/helmpack/chart-testing:v3.10.1 sh -c '
                set -e
                ns=aisix-standalone
                kubectl create namespace "$ns"
                if ! helm install aisix charts/aisix --namespace "$ns" \
                     --values charts/aisix/ci/standalone-values.yaml \
                     --wait --timeout 5m; then
                  kubectl -n "$ns" get pods -o wide || true
                  kubectl -n "$ns" describe pods || true
                  kubectl -n "$ns" logs -l app.kubernetes.io/name=aisix --tail=200 || true
                  exit 1
                fi
                helm uninstall aisix --namespace "$ns"
                kubectl delete namespace "$ns"
              '

      - name: Test aisix chart with several proxy listeners
        run: |
          kubectl cluster-info
          ns=aisix-listeners
          kubectl create namespace "$ns"
          # Self-signed is enough: the only TLS clients here are the kubelet's
          # probes and curl -k, and neither verifies the certificate.
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
              -subj "/CN=aisix.$ns.svc" \
              -keyout proxy-tls.key -out proxy-tls.crt
          kubectl -n "$ns" create secret tls aisix-ci-proxy-tls \
              --cert=proxy-tls.crt --key=proxy-tls.key
          rm -f proxy-tls.key proxy-tls.crt
          docker run --rm --interactive --network host \
              --name ct-aisix-listeners \
              --volume $HOME/.kube/config:/root/.kube/config \
              --volume $PWD:/workdir \
              --workdir /workdir \
              quay.io/helmpack/chart-testing:v3.10.1 sh -c '
                set -e
                ns=aisix-listeners
                if ! helm install aisix charts/aisix --namespace "$ns" \
                     --values charts/aisix/ci/standalone-values.yaml \
                     --values charts/aisix/ci/listeners-values.yaml \
                     --wait --timeout 5m; then
                  kubectl -n "$ns" get pods -o wide || true
                  kubectl -n "$ns" describe pods || true
                  kubectl -n "$ns" logs -l app.kubernetes.io/name=aisix --tail=200 || true
                  exit 1
                fi
                # Both listeners answer /livez through the one proxy Service.
                kubectl -n "$ns" run curl-https --rm --attach --restart=Never \
                    --image=curlimages/curl:8.11.1 --command -- \
                    curl -fsS -k https://aisix:443/livez
                kubectl -n "$ns" run curl-http --rm --attach --restart=Never \
                    --image=curlimages/curl:8.11.1 --command -- \
                    curl -fsS http://aisix:80/livez
                helm uninstall aisix --namespace "$ns"
                kubectl delete namespace "$ns"
              '

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run helm-docs
        run: |
          go install github.com/norwoodj/helm-docs/cmd/helm-docs@v1.13.1
          helm-docs --chart-search-root=${GITHUB_WORKSPACE}/charts
          DIFF=$(git diff ${GITHUB_WORKSPACE}/charts/*/README.md)
          if [ ! -z "$DIFF" ]; then
            echo "Please use helm-docs in your clone, of your fork, of the project, and commit an updated README.md for the chart."
            echo "$DIFF"
            exit 1
          fi
